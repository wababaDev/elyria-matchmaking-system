[project]
name = "elyria"
version = "0.1.0"
description = ""
authors = [
    {name = "Kasweka1",email = "kaswekamukoko@gmail.com"}
]
readme = "README.md"
package-mode = false
requires-python = ">=3.11, <4"
dependencies = [
    "django (>=5.2,<6.0)",
    "django-environ (>=0.14.0,<0.15.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "weasyprint (>=70.0,<71.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "coverage (>=7.16.2,<8.0.0)"
