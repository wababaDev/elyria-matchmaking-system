{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block error_title %}{% endblock %} · Elyria Matchmaking</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #FAF7F2; color: #2B2B2B; font-family: Georgia, "Times New Roman", serif; }
        .box { max-width: 520px; padding: 40px 24px; text-align: center; }
        .box img { height: 56px; margin-bottom: 28px; }
        h1 { color: #6E1423; font-weight: normal; font-size: 30px; margin: 0 0 12px; }
        hr { width: 60px; border: 0; border-top: 2px solid #C9A227; margin: 0 auto 20px; }
        p { font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; margin: 0 0 28px; }
        a { display: inline-block; background: #6E1423; color: #fff; text-decoration: none;
            font-family: Arial, sans-serif; padding: 12px 28px; border-radius: 2px; }
    </style>
</head>
<body>
    <div class="box">
        <img src="{% static 'front/assets/logo-hz.png' %}" alt="Elyria Matchmaking">
        <h1>{% block error_heading %}{% endblock %}</h1>
        <hr>
        <p>{% block error_message %}{% endblock %}</p>
        <a href="/">Back to home</a>
    </div>
</body>
</html>
