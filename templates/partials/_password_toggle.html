{# Show/hide eye on every password box on the page. Include once, just before </body>. #}
<style>
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 2.75rem !important; }
    .pw-toggle {
        position: absolute; top: 50%; right: 0.6rem; transform: translateY(-50%);
        background: none; border: 0; padding: 0.25rem; line-height: 0;
        color: #857a72; cursor: pointer;
    }
    .pw-toggle:hover, .pw-toggle:focus-visible { color: #6E1423; }
</style>
<script>
(function () {
    var EYE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    var EYE_OFF = EYE.replace('</svg>', '<line x1="3" y1="3" x2="21" y2="21"/></svg>');

    document.querySelectorAll('input[type="password"]').forEach(function (input) {
        var wrap = document.createElement('div');
        wrap.className = 'pw-wrap';
        input.parentNode.insertBefore(wrap, input);
        wrap.appendChild(input);

        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'pw-toggle';
        button.setAttribute('aria-label', 'Show password');
        button.innerHTML = EYE;
        button.addEventListener('click', function () {
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            button.innerHTML = show ? EYE_OFF : EYE;
            button.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });
        wrap.appendChild(button);
    });
})();
</script>
