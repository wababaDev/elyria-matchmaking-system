 {% load static %}
 
 <!-- ===== HEADER (same on every staff page) ===== -->
        <header class="app-header">
            <div class="main-header-container container-fluid">

                <div class="header-content-left">
                    <div class="header-element">
                        <div class="horizontal-logo">
                            <a href="dashboard.html" class="header-logo">
                                <img src="{% static 'front/assets/logo-white.png' %}" alt="Elyria" class="desktop-logo">
                                <img src="{% static 'front/assets/images/brand-logos/toggle-logo.png' %}" alt="Elyria" class="toggle-logo">
                            </a>
                        </div>
                    </div>
                    <div class="header-element">
                        <a aria-label="Toggle sidebar"
                            class="sidemenu-toggle header-link animated-arrow hor-toggle horizontal-navtoggle"
                            data-bs-toggle="sidebar" href="javascript:void(0);"><span></span></a>
                    </div>
                </div>

                <div class="header-content-right">
               
                    <!-- Signed-in staff member -->
                    <div class="header-element main-profile-user">
                        <a href="#" class="header-link dropdown-toggle" id="mainHeaderProfile" data-bs-toggle="dropdown"
                            data-bs-auto-close="outside" aria-expanded="false">
                            <div class="d-flex align-items-center">
                                <span class="avatar avatar-sm avatar-rounded bg-primary me-xxl-2 me-0">{{ request.user.first_name|first }}{{ request.user.last_name|first }}</span>
                                <div class="d-xxl-block d-none my-auto">
                                    <h6 class="fw-semibold mb-0 lh-1 fs-14">{{ request.user.full_name }}</h6>
                                    <span class="op-7 fw-normal d-block fs-11 text-muted">{{ request.user.profile.job_title|default:"Staff" }}</span>
                                </div>
                            </div>
                        </a>
                        <ul class="main-header-dropdown dropdown-menu pt-0 header-profile-dropdown dropdown-menu-end"
                            aria-labelledby="mainHeaderProfile">
                            <li class="dropdown-item"><a class="d-flex w-100" href="#"><i
                                        class="fe fe-lock fs-18 me-2 text-primary"></i>Change password</a></li>
                            <li class="dropdown-item">
                               <form method="post" action="{% url 'base:sign-out' %}" class="m-0">
                                   {% csrf_token %}
                                   <input type="hidden" name="next" value="{% url 'base:staff-sign-in' %}">
                                   <button type="submit" class="d-flex w-100 border-0 bg-transparent p-0 text-start">
                                       <i class="fe fe-log-out fs-18 me-2 text-primary"></i>Log out
                                   </button>
                               </form>
                           </li>
                        </ul>
                    </div>
                </div>

            </div>
        </header>
