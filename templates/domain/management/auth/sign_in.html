{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr" data-nav-layout="vertical" data-theme-mode="light" data-header-styles="light" data-menu-styles="color">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Staff Sign In — Elyria</title>

    <link rel="icon" href="{% static 'back/assets/images/brand-logos/favicon.ico' %}" type="image/x-icon">
    <script src="{% static 'back/assets/js/main.js' %}"></script>
    <link id="style" href="{% static 'back/assets/libs/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'back/assets/css/styles.min.css' %}" rel="stylesheet">
    <link href="{% static 'back/assets/css/icons.css' %}" rel="stylesheet">
    <link href="{% static 'back/assets/css/elyria-admin.css' %}" rel="stylesheet">

    <style>
        body.staff-auth { background: rgb(var(--primary-rgb)); }
        .staff-auth .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
        .staff-auth .auth-card { width: 100%; max-width: 400px; }
        .staff-auth .auth-logo { display: block; text-align: center; margin-bottom: 1.5rem; }
        .staff-auth .auth-logo img { height: 56px; width: auto; }
        .staff-auth .auth-note { color: rgba(255, 255, 255, 0.7); text-align: center; font-size: 0.8rem; margin-top: 1.25rem; }
    </style>
</head>

<body class="staff-auth">
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="{% static 'front/assets/logo-white.png' %}" alt="Elyria">
            </div>

            <div class="card custom-card">
                <div class="card-body p-4 p-sm-5">
                    <h1 class="page-title mb-1">Staff Sign In</h1>
                    <p class="text-muted fs-13 mb-4">Elyria team access only.</p>

                    {% if form.non_field_errors %}
                        <div class="alert alert-danger fs-13 py-2">Incorrect email or password.</div>
                    {% endif %}

                    <form method="post" novalidate>
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ next }}">

                        <div class="mb-3">
                            <label for="st-email" class="form-label">Work email</label>
                            <input type="email" class="form-control" id="st-email" name="username"
                                   value="{{ form.username.value|default:'' }}" autocomplete="username" required autofocus>
                        </div>
                        <div class="mb-2">
                            <label for="st-password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="st-password" name="password"
                                   autocomplete="current-password" required>
                        </div>
                        <div class="text-end mb-4">
                            <a href="#" class="fs-13 text-primary">Forgot password?</a>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Sign in</button>
                    </form>
                </div>
            </div>

            <p class="auth-note">This page is not linked from the public website.</p>
        </div>
    </div>

    <script src="{% static 'back/assets/libs/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
