name: CI

on:
  push:
    branches: [beta, main]
  pull_request:
    branches: [beta, main]

env:
  IMAGE_NAME: ghcr.io/wababadev/elyria-matchmaking-system

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.1.3   # same version as the Dockerfile

      - name: Install dependencies
        run: poetry install --no-root

      - name: Django system check
        run: poetry run python manage.py check

      - name: System libraries for PDFs
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-dejavu-core

      - name: No missing migrations
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Production settings load
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-only
          ALLOWED_HOSTS: localhost
          CSRF_TRUSTED_ORIGINS: http://localhost
          DATABASE_URL: sqlite:////tmp/ci.sqlite3
        run: poetry run python manage.py check --deploy

      - name: Tests
        run: poetry run python manage.py test domain notification

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (push only for beta/main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.event_name == 'push' && github.ref_name || 'pr' }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'main' && 'production' || 'uat' }}
    permissions:
      packages: read
    steps:
      - name: Pull and restart on the server
        uses: appleboy/ssh-action@v1
        env:
          STACK: ${{ github.ref_name == 'main' && 'prod' || 'uat' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: STACK,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /srv/elyria/$STACK
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f