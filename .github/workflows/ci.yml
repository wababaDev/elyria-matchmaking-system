name: CI

on:
  push:
    branches: [beta, main]
  pull_request:
    branches: [beta, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.1.3   # same version as the Dockerfile

      - name: Install dependencies
        run: poetry install --no-root

      - name: Django system check
        run: poetry run python manage.py check

      - name: No missing migrations
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Production settings load
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-only
          ALLOWED_HOSTS: localhost
          CSRF_TRUSTED_ORIGINS: http://localhost
          DATABASE_URL: sqlite:////tmp/ci.sqlite3
        run: poetry run python manage.py check --deploy

      - name: Tests
        run: poetry run python manage.py test domain notification

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Image builds
        run: docker build -f docker/Dockerfile -t elyria:ci .