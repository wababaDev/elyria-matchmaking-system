services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:${APP_PORT}:8000"     # only Caddy on the same machine can reach it
    volumes:
      - ${MEDIA_DIR}:/app/media
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach PostgreSQL on the server
    restart: unless-stopped